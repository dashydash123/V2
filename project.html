<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HF Model BOM</title>
<style>
:root{--or:#FF9D00;--dk:#1A1A2E;--md:#16213E;--cd:#0F3460;--tx:#E0E0E0;--tm:#A0A0B0;
  --hb:#1A3A2A;--hbr:#2ECC71;--ht:#A8F0C0;
  --mb:#3A2E00;--mbr:#F0C040;--mt:#FFE88A;
  --lb:#3A1F00;--lbr:#E07820;--lt:#FFB870;
  --ub:#3A0A0A;--ubr:#E05050;--ut:#FFA0A0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dk);color:var(--tx);font-family:'Inter','Segoe UI',sans-serif;min-height:100vh;}
.hdr{background:linear-gradient(135deg,var(--md),var(--cd));border-bottom:2px solid var(--or);padding:1.4rem 2rem 1rem;}
.hdr h1{color:var(--or);font-size:1.5rem;font-weight:700;}
.hdr p{color:var(--tm);font-size:.82rem;margin-top:.3rem;}
.main{max-width:1200px;margin:0 auto;padding:1.5rem 1.5rem 3rem;}
.card{background:var(--md);border:1px solid #2A3A5A;border-radius:10px;padding:1.3rem 1.5rem;margin-bottom:1.5rem;}
.row{display:flex;gap:.8rem;align-items:flex-end;}
.row input{flex:1;background:#0A1628;color:var(--tx);border:1px solid #2A3A5A;border-radius:7px;
  padding:.6rem .9rem;font-size:.9rem;outline:none;transition:border .2s;}
.row input:focus{border-color:var(--or);box-shadow:0 0 0 2px rgba(255,157,0,.2);}
.row input::placeholder{color:#445;}
button.run{background:var(--or);color:#1A1A2E;font-weight:700;border:none;border-radius:7px;
  padding:.62rem 1.6rem;font-size:.9rem;cursor:pointer;white-space:nowrap;}
button.run:hover{opacity:.88;}
button.run:disabled{opacity:.45;cursor:not-allowed;}
#log{background:#0A1628;border-radius:6px;padding:.75rem 1rem;font-size:.76rem;color:#7EB8F7;
  font-family:monospace;max-height:120px;overflow-y:auto;line-height:1.6;display:none;}
.slbl{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--or);margin-bottom:.55rem;}
.lpill{display:inline-block;background:var(--hb);border:1px solid var(--hbr);color:var(--ht);
  border-radius:6px;padding:.32rem .9rem;font-size:.95rem;font-weight:600;}
.section{margin-bottom:1.8rem;}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th{background:var(--cd);color:var(--tm);font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  font-size:.68rem;padding:.5rem .75rem;text-align:left;border-bottom:1px solid #2A3A5A;}
td{padding:.5rem .75rem;border-bottom:1px solid #1A2A3A;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr.rh td{background:rgba(46,204,113,.05);}tr.rm td{background:rgba(240,192,64,.05);}
tr.rl td{background:rgba(224,120,32,.07);}tr.ru td{background:rgba(224,80,80,.07);}
.bh,.bm,.bl,.bu{padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:700;white-space:nowrap;}
.bh{background:var(--hb);border:1px solid var(--hbr);color:var(--ht);}
.bm{background:var(--mb);border:1px solid var(--mbr);color:var(--mt);}
.bl{background:var(--lb);border:1px solid var(--lbr);color:var(--lt);}
.bu{background:var(--ub);border:1px solid var(--ubr);color:var(--ut);}
code{font-family:monospace;font-size:.8rem;color:#A0C8FF;}
a.sl{color:#7EB8F7;font-size:.76rem;text-decoration:none;}a.sl:hover{text-decoration:underline;}
.dl-row{display:flex;align-items:center;gap:1.2rem;padding-top:.5rem;}
button.dl{background:var(--or);color:#1A1A2E;font-weight:700;border:none;border-radius:7px;
  padding:.55rem 1.4rem;font-size:.88rem;cursor:pointer;}
button.dl:hover{opacity:.88;}
.dl-note{color:var(--tm);font-size:.78rem;}
#results{display:none;}
.meta-row{display:flex;gap:2rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.meta-box{flex:1;min-width:180px;}
.empty{color:var(--tm);font-size:.84rem;padding:.5rem 0;}
.warn{background:#2A1A00;border:1px solid var(--or);border-radius:6px;padding:.7rem 1rem;
  font-size:.8rem;color:#FFD080;margin-bottom:1rem;}
</style>
</head>
<body>

<div class="hdr">
  <h1>📋 HuggingFace Model BOM</h1>
  <p>Paste a HuggingFace model URL → get model / dataset / dependency licenses, sourced and confidence-rated.</p>
</div>

<div class="main">
  <div class="card">
    <div class="row">
      <input id="urlIn" type="text" placeholder="https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2" />
      <button class="run" id="runBtn" onclick="handleRun()">Run BOM →</button>
    </div>
    <div style="margin-top:.9rem;"><div id="log"></div></div>
  </div>

  <div id="results">
    <div id="modelSection" class="section"></div>
    <div id="datasetSection" class="section"></div>
    <div id="arxivSection" class="section"></div>
    <div id="depsSection" class="section"></div>
    <hr style="border-color:#2A3A5A;margin:1.2rem 0;">
    <div class="dl-row">
      <button class="dl" id="dlBtn">⬇  Download Excel BOM</button>
      <span class="dl-note">Colour-coded rows, clickable links, Summary sheet.</span>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────
const GH_API = "https://api.github.com";
const SKIP = new Set(["unknown","other","not specified","none","","[]","['unknown']","['other']"]);
const LICENSE_PATTERNS = [
  [/apache[\s-]*2\.0/i,"Apache-2.0"],[/apache[\s-]*license[\s,]*version\s*2/i,"Apache-2.0"],
  [/mit\s+license/i,"MIT"],[/\bmit\b/i,"MIT"],
  [/cc[\s-]*by[\s-]*nc[\s-]*sa[\s-]*4/i,"CC BY-NC-SA 4.0"],[/cc[\s-]*by[\s-]*nc[\s-]*sa[\s-]*3/i,"CC BY-NC-SA 3.0"],
  [/cc[\s-]*by[\s-]*nc[\s-]*sa/i,"CC BY-NC-SA"],
  [/cc[\s-]*by[\s-]*sa[\s-]*4/i,"CC BY-SA 4.0"],[/cc[\s-]*by[\s-]*sa[\s-]*3/i,"CC BY-SA 3.0"],
  [/cc[\s-]*by[\s-]*sa/i,"CC BY-SA"],[/cc[\s-]*by[\s-]*nc[\s-]*4/i,"CC BY-NC 4.0"],[/cc[\s-]*by[\s-]*nc/i,"CC BY-NC"],
  [/cc[\s-]*by[\s-]*4/i,"CC BY 4.0"],[/cc[\s-]*by[\s-]*3/i,"CC BY 3.0"],[/cc[\s-]*by\b/i,"CC BY"],
  [/cc[\s-]*0/i,"CC0 / Public Domain"],
  [/creative commons\s+attribution[\s-]+sharealike\s+4/i,"CC BY-SA 4.0"],
  [/creative commons\s+attribution[\s-]+sharealike\s+3/i,"CC BY-SA 3.0"],
  [/creative commons\s+attribution[\s-]+noncommercial/i,"CC BY-NC"],
  [/creative commons\s+attribution/i,"CC BY"],
  [/gpl[\s-]*v?3/i,"GPL-3.0"],[/gpl[\s-]*v?2/i,"GPL-2.0"],[/lgpl/i,"LGPL"],
  [/bsd[\s-]*3/i,"BSD-3-Clause"],[/bsd[\s-]*2/i,"BSD-2-Clause"],
  [/\bbsd\s+license\b/i,"BSD License"],[/\bbsd\b/i,"BSD License"],
  [/odc[\s-]*by[\s-]*1\.0/i,"ODC-BY 1.0"],[/odc[\s-]*by/i,"ODC-BY"],
  [/open\s+data\s+commons/i,"ODC"],
];
const STDLIB = new Set(["argparse","gzip","json","logging","os","random","shutil","sys",
  "threading","time","re","subprocess","ast","math","collections","itertools",
  "functools","typing","pathlib","io","copy","datetime","struct","abc","contextlib"]);
const FORMAT_MAP = {".safetensors":"safetensors",".bin":"torch",".h5":"tensorflow",
  ".msgpack":"flax/jax",".gguf":"gguf",".onnx":"onnxruntime"};
const CONF_FILL = {HIGH:"C6EFCE",MEDIUM:"FFEB9C",LOW:"FFCC99",UNRESOLVED:"FFC7CE"};
const BADGE_CLASS = {HIGH:"bh",MEDIUM:"bm",LOW:"bl",UNRESOLVED:"bu"};
const ROW_CLASS = {HIGH:"rh",MEDIUM:"rm",LOW:"rl",UNRESOLVED:"ru"};

// ── State ─────────────────────────────────────────────────────────
let currentBom = null;
const ghCache = {};

// ── Helpers ───────────────────────────────────────────────────────
function normalizeId(raw) {
  raw = raw.trim();
  const m = raw.match(/huggingface\.co\/([^/?#]+\/[^/?#]+)/);
  return m ? m[1] : raw;
}
function cleanLic(raw) {
  if (!raw) return null;
  if (Array.isArray(raw)) {
    const u = raw.filter(v => !SKIP.has(String(v).trim().toLowerCase()));
    return u.length ? u.join(", ") : null;
  }
  const s = String(raw).trim();
  if (SKIP.has(s.toLowerCase())) return null;
  if (s.startsWith("[") && s.endsWith("]")) {
    const items = s.slice(1,-1).split(",").map(i=>i.trim().replace(/^['"]|['"]$/g,""));
    const u = items.filter(i=>!SKIP.has(i.toLowerCase()));
    return u.length ? u.join(", ") : null;
  }
  return s || null;
}
function scanLic(text) {
  if (!text) return null;
  for (const [re, label] of LICENSE_PATTERNS) if (re.test(text)) return label;
  return null;
}
async function safeGet(url, opts={}) {
  try {
    const upstreamHeaders = (opts && opts.headers) ? opts.headers : {};
    const r = await fetch("/proxy?url=" + encodeURIComponent(url), { headers: { "X-Upstream-Headers": JSON.stringify(upstreamHeaders) } });
    return r.ok ? r : null;
  } catch { return null; }
}
function extractImportsFromCode(code) {
  const imports = new Set();
  for (const m of code.matchAll(/^import\s+([\w]+)/gm)) imports.add(m[1]);
  for (const m of code.matchAll(/^from\s+([\w]+)/gm)) imports.add(m[1]);
  return imports;
}
function firstUrl(text) {
  if (!text) return "";
  const m = text.match(/https?:\/\/[^\s)\]]+/);
  return m ? m[0].replace(/[.,;)]+$/,"") : "";
}
function badge(conf) { return `<span class="${BADGE_CLASS[conf]||'bu'}">${conf}</span>`; }

// ── Progress log ──────────────────────────────────────────────────
let logLines = [];
function log(msg) {
  logLines.push(msg);
  const el = document.getElementById("log");
  el.style.display = "block";
  el.innerHTML = logLines.slice(-80).join("<br>");
  el.scrollTop = el.scrollHeight;
}

// ── GitHub helper ─────────────────────────────────────────────────
async function ghGetLicense(fullName) {
  if (ghCache[fullName]) return ghCache[fullName];
  const resp = await safeGet(`${GH_API}/repos/${fullName}`, {headers:{"Accept":"application/vnd.github+json"}});
  if (!resp) return [null, "UNRESOLVED"];
  const data = await resp.json();
  const li = data.license;
  if (li) {
    const spdx = (li.spdx_id||"").trim();
    if (spdx && spdx.toUpperCase() !== "NOASSERTION") {
      ghCache[fullName] = [spdx, "HIGH"]; return [spdx, "HIGH"];
    }
    // NOASSERTION — read raw LICENSE file
    const fr = await safeGet(`${GH_API}/repos/${fullName}/license`,{headers:{"Accept":"application/vnd.github+json"}});
    if (fr) {
      const fd = await fr.json();
      try {
        const txt = atob((fd.content||"").replace(/\n/g,""));
        const found = scanLic(txt);
        if (found) { ghCache[fullName]=[found,"MEDIUM"]; return [found,"MEDIUM"]; }
      } catch {}
    }
  }
  // Try README
  const rr = await safeGet(`${GH_API}/repos/${fullName}/readme`,{headers:{"Accept":"application/vnd.github+json"}});
  if (rr) {
    const rd = await rr.json();
    try {
      const txt = atob((rd.content||"").replace(/\n/g,""));
      const found = scanLic(txt);
      if (found) { ghCache[fullName]=[found,"MEDIUM"]; return [found,"MEDIUM"]; }
    } catch {}
  }
  return [null,"UNRESOLVED"];
}

// ── Name similarity check ─────────────────────────────────────────
const FORK_WORDS = new Set(["open","awesome","my","fork","mirror","unofficial","demo",
  "example","simple","tiny","fast","mini","alt","new","old","legacy"]);
function nameSimilarOk(searchTerm, candidateFull) {
  const repoName = candidateFull.split("/").pop();
  const rc = repoName.toLowerCase().replace(/[^a-z0-9]/g,"");
  const tc = searchTerm.toLowerCase().replace(/[^a-z0-9]/g,"");
  if (!tc) return false;
  if (rc === tc || rc.startsWith(tc)) return true;
  const idx = rc.indexOf(tc);
  if (idx === -1) return false;
  if (idx === 0) return true;
  const prefix = rc.slice(0, idx);
  if (FORK_WORDS.has(prefix)) return false;
  return prefix.length <= 3;
}

// ── Dataset license sources ───────────────────────────────────────
async function hfDatasetApiLookup(dsId) {
  const url = `https://huggingface.co/api/datasets/${dsId}`;
  const r = await safeGet(url);
  if (!r) return {};
  const data = await r.json();
  const card = data.cardData || {};
  let lic = cleanLic(card.license);
  if (lic) return {license:lic, source:`HuggingFace Datasets API (${url})`, confidence:"HIGH", _readme:(data.description||""), _tags:(data.tags||[])};
  for (const tag of (data.tags||[])) {
    if (typeof tag==="string" && tag.startsWith("license:")) {
      lic = cleanLic(tag.split(":",1)[1]?.trim());
      if (lic) return {license:lic, source:`HuggingFace Datasets API tags`, confidence:"HIGH", _readme:(data.description||""), _tags:(data.tags||[])};
    }
  }
  return {_readme:(data.description||""), _tags:(data.tags||[])};
}

async function githubFromCardLookup(dsId, readmeText) {
  if (!readmeText) return {};
  const matches = readmeText.matchAll(/github\.com\/([A-Za-z0-9_.\-]+\/[A-Za-z0-9_.\-]+)/g);
  const seen = new Set();
  for (const m of matches) {
    const fullName = m[1].replace(/\.+$/,"");
    if (seen.has(fullName)) continue;
    if (["shields.io","badge","img.shields"].some(s=>fullName.toLowerCase().includes(s))) continue;
    seen.add(fullName);
    if (seen.size > 1) break; // cap to 1 to conserve GitHub budget
    const [lic, conf] = await ghGetLicense(fullName);
    if (lic) return {license:lic, source:`GitHub repo ${fullName} (linked from HF dataset README)`, confidence:conf};
  }
  return {};
}

async function wikidataLookup(dsId) {
  const name = dsId.split("/").pop().replace(/[_-]/g," ");
  for (const q of [`${name} dataset`, name]) {
    const sr = await safeGet(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(q)}&language=en&type=item&format=json&origin=*&limit=3`);
    if (!sr) continue;
    const sd = await sr.json();
    for (const item of (sd.search||[]).slice(0,2)) {
      const er = await safeGet(`https://www.wikidata.org/wiki/Special:EntityData/${item.id}.json`);
      if (!er) continue;
      const ed = await er.json();
      const claims = ed.entities?.[item.id]?.claims || {};
      const p31 = (claims.P31||[]).map(c=>c.mainsnak?.datavalue?.value?.id||"");
      if (p31.some(v=>["Q7397","Q21127166","Q341","Q4117139"].includes(v))) continue;
      for (const cl of (claims.P275||[])) {
        try {
          const vid = cl.mainsnak.datavalue.value.id;
          const lr = await safeGet(`https://www.wikidata.org/wiki/Special:EntityData/${vid}.json`);
          if (!lr) continue;
          const ld = await lr.json();
          const label = ld.entities?.[vid]?.labels?.en?.value;
          if (label) return {license:label, source:`Wikidata ${item.id} P275 (https://www.wikidata.org/wiki/${item.id})`, confidence:"MEDIUM"};
        } catch {}
      }
    }
  }
  return {};
}

async function githubSearchLookup(dsId) {
  const term = dsId.split("/").pop().replace(/[_-]/g," ");
  await new Promise(r=>setTimeout(r,1100)); // stay under 10/min search limit
  const r = await safeGet(`${GH_API}/search/repositories?q=${encodeURIComponent(term)}+in:name&sort=stars&order=desc&per_page=5`,{headers:{"Accept":"application/vnd.github+json"}});
  if (!r) return {};
  const data = await r.json();
  const plausible = (data.items||[]).filter(i=>nameSimilarOk(term,i.full_name));
  for (const item of plausible.slice(0,2)) {
    const [lic,conf] = await ghGetLicense(item.full_name);
    if (lic) return {license:lic, source:`GitHub name-search → ${item.full_name} — verify official repo`, confidence:"MEDIUM"};
  }
  return {};
}

async function hfPageScrape(dsId) {
  const r = await safeGet(`https://huggingface.co/datasets/${dsId}`);
  if (!r) return {};
  const html = await r.text();
  const stripped = html.replace(/<[^>]+>/g," ");
  const lic = scanLic(stripped);
  if (lic) return {license:lic, source:`HuggingFace dataset page text (https://huggingface.co/datasets/${dsId})`, confidence:"LOW"};
  return {};
}

async function resolveDatasetLicense(dsId) {
  log(`  [2] ${dsId} — HF API…`);
  const hfResult = await hfDatasetApiLookup(dsId);
  if (hfResult.license) return {via:"HF Datasets REST API", ...hfResult};
  const readmeText = hfResult._readme || "";

  log(`  [3] ${dsId} — GitHub from card…`);
  const ghCard = await githubFromCardLookup(dsId, readmeText);
  if (ghCard.license) return {via:"GitHub (linked from HF card)", ...ghCard};

  // Fetch dataset README directly from HF for GitHub URL extraction
  const readme = await safeGet(`https://huggingface.co/datasets/${dsId}/raw/main/README.md`);
  if (readme) {
    const txt = await readme.text();
    const ghCard2 = await githubFromCardLookup(dsId, txt);
    if (ghCard2.license) return {via:"GitHub (linked from HF card)", ...ghCard2};
  }

  log(`  [4] ${dsId} — HF page scrape…`);
  const page = await hfPageScrape(dsId);
  if (page.license) return {via:"HF page scrape", ...page};

  log(`  [5] ${dsId} — Wikidata…`);
  const wd = await wikidataLookup(dsId);
  if (wd.license) return {via:"Wikidata (P275)", ...wd};

  log(`  [6] ${dsId} — GitHub search…`);
  const ghs = await githubSearchLookup(dsId);
  if (ghs.license) return {via:"GitHub name-search", ...ghs};

  return {license:"NOT RESOLVED — needs manual research", source:"All automated sources exhausted", confidence:"UNRESOLVED", via:"none"};
}

// ── Dependency license ─────────────────────────────────────────────
async function pypiLookup(pkg) {
  const norm = pkg.toLowerCase().replace(/_/g,"-");
  const r = await safeGet(`https://pypi.org/pypi/${norm}/json`);
  if (!r) return null;
  const data = await r.json();
  const info = data.info || {};
  const lic = (info.license||"").trim();
  if (lic && !["","unknown","none"].includes(lic.toLowerCase()))
    return {license:lic, source:`PyPI info.license (https://pypi.org/pypi/${norm}/json)`, confidence:"HIGH"};
  const classifiers = (info.classifiers||[]).filter(c=>c.startsWith("License ::"));
  if (classifiers.length) {
    const labels = classifiers.map(c=>c.split(" :: ").pop());
    return {license:labels.join(" / "), source:`PyPI License classifiers (${norm})`, confidence:"HIGH"};
  }
  return null;
}

async function resolveDepLicense(lib) {
  for (const v of [lib, lib.toLowerCase(), lib.toLowerCase().replace(/_/g,"-")]) {
    const r = await pypiLookup(v);
    if (r) return r;
  }
  return {license:"NOT RESOLVED", source:`PyPI lookup found no license for '${lib}'`, confidence:"UNRESOLVED"};
}

// ── arXiv dataset discovery ────────────────────────────────────────
const DATASET_MENTION_RE = /\b([A-Z][A-Za-z0-9\-]*(?:\s+[A-Z][A-Za-z0-9\-]*){0,3})\s+(?:dataset|corpus|benchmark)\b/g;
const ARXIV_NOISE = new Set(["the","this","our","a","an","large","new","training","test",
  "evaluation","benchmark","standard","general","public","existing","popular","following",
  "proposed","various","several","multiple","different","common","real","world","open"]);

async function fetchArxivAbstract(arxivId) {
  // Uses arXiv's official keyless Atom API — no scraping, CORS-enabled
  const r = await safeGet(`https://export.arxiv.org/api/query?id_list=${arxivId}`);
  if (!r) return "";
  const xml = await r.text();
  const m = xml.match(/<summary>([\s\S]*?)<\/summary>/);
  return m ? m[1].replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim() : "";
}

function extractCandidateDatasets(abstract) {
  const found = [], seen = new Set();
  DATASET_MENTION_RE.lastIndex = 0;
  let m;
  while ((m = DATASET_MENTION_RE.exec(abstract)) !== null) {
    const name = m[1].trim();
    if (ARXIV_NOISE.has(name.toLowerCase()) || name.length < 3 || seen.has(name)) continue;
    seen.add(name);
    found.push(name);
  }
  return found;
}

async function resolveArxivCandidateLicense(name) {
  // Same chain but cap confidence at MEDIUM — the dataset *name*
  // itself is text-mined, not confirmed structured metadata
  log(`  [arxiv] resolving candidate: ${name}…`);
  const note = " | Name extracted from arXiv abstract — confirm dataset identity before relying on this";

  const wd = await wikidataLookup(name);
  if (wd.license) return {via:"Wikidata (P275)", ...wd, source:(wd.source||"")+note, confidence:MEDIUM};

  const ghs = await githubSearchLookup(name);
  if (ghs.license) return {via:"GitHub name-search", ...ghs, source:(ghs.source||"")+note, confidence:"MEDIUM"};

  return {license:"NOT RESOLVED", source:"All sources exhausted"+note, confidence:"UNRESOLVED", via:"none"};
}

async function discoverFromArxiv(tags) {
  const arxivIds = tags
    .filter(t=>typeof t==="string" && t.toLowerCase().startsWith("arxiv:"))
    .map(t=>t.split(":")[1]?.trim())
    .filter(Boolean)
    .slice(0,5); // cap to 5 papers

  if (!arxivIds.length) return {};

  log(`[arxiv] Found ${arxivIds.length} linked paper(s): ${arxivIds.join(", ")}`);
  log(`[arxiv] Fetching abstracts for dataset mentions…`);

  const allCandidates = [];
  for (const id of arxivIds) {
    const abstract = await fetchArxivAbstract(id);
    if (abstract) {
      const names = extractCandidateDatasets(abstract);
      for (const n of names) if (!allCandidates.includes(n)) allCandidates.push(n);
    }
    await new Promise(r=>setTimeout(r,500)); // be polite to arXiv
  }

  if (!allCandidates.length) {
    log("[arxiv] No dataset mentions found in abstracts.");
    return {};
  }
  log(`[arxiv] Candidate names found: ${allCandidates.join(", ")}`);

  const results = {};
  for (const name of allCandidates) {
    const r = await resolveArxivCandidateLicense(name);
    results[`${name} (arXiv abstract)`] = r;
  }
  return results;
}

const MEDIUM = "MEDIUM"; // shorthand used in resolveArxivCandidateLicense above

// ── Main BOM builder ───────────────────────────────────────────────
async function buildBOM(rawInput) {
  const repoId = normalizeId(rawInput);
  log(`Building BOM for: ${repoId}`);

  // 1) Model metadata
  log("[1] Fetching model card…");
  let modelLicense = "NOT SPECIFIED", libraryName = "NOT SPECIFIED";
  let datasetIds = [], tags = [], siblings = [];

  const mr = await safeGet(`https://huggingface.co/api/models/${repoId}?full=true`);
  if (!mr) throw new Error(`Could not fetch model card for '${repoId}'. Check the URL or network.`);
  const md = await mr.json();
  const card = md.cardData || {};
  modelLicense = cleanLic(card.license) || cleanLic(md.tags?.find(t=>t?.startsWith?.("license:"))?.split(":",1)[1]) || "NOT SPECIFIED";
  libraryName = card.library_name || md.library_name || md.libraryName || "NOT SPECIFIED";
  datasetIds = card.datasets || [];
  tags = md.tags || [];
  siblings = md.siblings || [];

  // 2) Dataset licenses (from model card metadata)
  log("[2] Resolving dataset licenses from model card…");
  const datasetLicenses = {};
  for (const dsId of datasetIds) {
    const result = await resolveDatasetLicense(dsId);
    datasetLicenses[dsId] = result;
    log(`    → [${result.confidence}] ${result.license} via ${result.via}`);
  }

  // 2b) arXiv dataset discovery — always runs (catches models like BAAI/bge
  //     that list no datasets in metadata but link papers that name them)
  log("[2b] Checking linked arXiv papers for dataset mentions…");
  const arxivDatasets = await discoverFromArxiv(tags);
  if (Object.keys(arxivDatasets).length)
    log(`[2b] Found ${Object.keys(arxivDatasets).length} candidate(s) from arXiv abstracts.`);
  else
    log("[2b] No arXiv-derived dataset candidates found.");

  // 3) Dependencies
  log("[3] Resolving dependency licenses…");
  const dependencies = [];
  const seen = new Set();

  // From library_name
  if (libraryName && libraryName !== "NOT SPECIFIED") {
    seen.add(libraryName);
    const r = await resolveDepLicense(libraryName);
    dependencies.push({library:libraryName, version:"not pinned by model repo", depSource:"model card library_name", ...r});
  }

  // From file format signals
  const impliedLibs = new Set();
  for (const f of siblings) {
    const fname = f.rfilename || f.path || "";
    for (const [ext, lib] of Object.entries(FORMAT_MAP)) {
      if (fname.endsWith(ext)) impliedLibs.add(lib);
    }
  }

  // From .py file import scanning
  const pyFiles = siblings.filter(f=>(f.rfilename||f.path||"").endsWith(".py")).slice(0,5);
  const codeImports = new Set();
  for (const f of pyFiles) {
    const fn = f.rfilename || f.path;
    const cr = await safeGet(`https://huggingface.co/${repoId}/raw/main/${fn}`);
    if (cr) {
      const code = await cr.text();
      for (const imp of extractImportsFromCode(code)) codeImports.add(imp);
    }
  }
  for (const imp of STDLIB) codeImports.delete(imp);

  for (const imp of [...codeImports].sort()) {
    if (seen.has(imp)) continue;
    seen.add(imp);
    const r = await resolveDepLicense(imp);
    dependencies.push({library:imp, version:"not pinned by model repo", depSource:"import scan of repo .py files", ...r});
    log(`    dep: ${imp} → ${r.license} [${r.confidence}]`);
  }

  return {modelId:repoId, modelLicense, datasetLicenses, arxivDatasets, dependencies, impliedLibs:[...impliedLibs]};
}

// ── UI rendering ───────────────────────────────────────────────────
function linkify(text) {
  if (!text) return "";
  const url = firstUrl(text);
  if (!url) return text;
  const before = text.slice(0, text.indexOf(url)).replace(/\s*[—–-]\s*$/,"").trim();
  return (before ? before+" " : "") + `<a class="sl" href="${url}" target="_blank">🔗 Open source</a>`;
}

function renderResults(bom) {
  // Model section
  document.getElementById("modelSection").innerHTML = `
    <div class="slbl">Model License</div>
    <div style="display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start">
      <div><div class="lpill">${bom.modelLicense}</div></div>
      ${bom.impliedLibs.length ? `<div><div class="slbl">Weight Formats Imply</div>
        <span style="color:#A0C8FF;font-size:.84rem">${bom.impliedLibs.map(l=>`<code>${l}</code>`).join(" · ")}</span></div>` : ""}
    </div>`;

  // Dataset section
  const dsEntries = Object.entries(bom.datasetLicenses);
  const dsSection = document.getElementById("datasetSection");
  dsSection.innerHTML = `<div class="slbl">Dataset Licenses</div>`;
  if (!dsEntries.length) {
    dsSection.innerHTML += `<p class="empty">No datasets listed in this model's metadata.</p>`;
  } else {
    const rows = dsEntries.map(([id,info])=>{
      const c = info.confidence||"UNRESOLVED";
      return `<tr class="${ROW_CLASS[c]||'ru'}"><td><code>${id}</code></td><td>${info.license||""}</td>
        <td>${badge(c)}</td><td style="color:var(--tm)">${info.via||""}</td>
        <td>${linkify(info.source||"")}</td></tr>`;
    }).join("");
    dsSection.innerHTML += `<table><thead><tr><th>Dataset</th><th>License</th><th>Confidence</th><th>Resolved Via</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // Deps section
  const depsSection = document.getElementById("depsSection");
  depsSection.innerHTML = `<div class="slbl">Dependencies</div>`;
  if (!bom.dependencies.length) {
    depsSection.innerHTML += `<p class="empty">No dependencies detected.</p>`;
  } else {
    const rows = bom.dependencies.map(d=>{
      const c = d.confidence||"UNRESOLVED";
      return `<tr class="${ROW_CLASS[c]||'ru'}"><td><code>${d.library}</code></td>
        <td style="color:var(--tm)">${d.version}</td><td>${d.license}</td>
        <td>${badge(c)}</td><td style="color:var(--tm)">${d.depSource||""}</td>
        <td>${linkify(d.source||"")}</td></tr>`;
    }).join("");
    depsSection.innerHTML += `<table><thead><tr><th>Library</th><th>Version</th><th>License</th><th>Confidence</th><th>Detected From</th><th>License Source</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  document.getElementById("results").style.display = "block";

  // arXiv section
  const arxivEntries = Object.entries(bom.arxivDatasets || {});
  const arxivSection = document.getElementById("arxivSection");
  if (!arxivEntries.length) {
    arxivSection.innerHTML = "";
  } else {
    const rows = arxivEntries.map(([name, info]) => {
      const c = info.confidence || "UNRESOLVED";
      return `<tr class="${ROW_CLASS[c]||'ru'}">
        <td><code>${name}</code></td>
        <td>${info.license||""}</td>
        <td>${badge(c)}</td>
        <td style="color:var(--tm)">${info.via||""}</td>
        <td>${linkify(info.source||"")}</td></tr>`;
    }).join("");
    arxivSection.innerHTML = `
      <div class="slbl">Datasets mentioned in linked arXiv papers</div>
      <div style="background:#1A2030;border:1px solid #3A4A2A;border-radius:6px;padding:.5rem .8rem;margin-bottom:.7rem;font-size:.78rem;color:#B0C090;">
        ⚠ These dataset names were extracted from paper abstracts — not structured metadata.
        Verify the dataset identity and relevance before treating this as confirmed.
      </div>
      <table><thead><tr><th>Dataset (text-mined name)</th><th>License</th><th>Confidence</th><th>Resolved Via</th><th>Source</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }
}

// ── Excel export ───────────────────────────────────────────────────
function buildExcel(bom) {
  const wb = XLSXStyle.utils.book_new();
  const hdrStyle = {font:{bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"2F5597"}},alignment:{horizontal:"left"}};
  const titleStyle = {font:{bold:true,sz:13}};

  function makeSheet(headers, rows, confidenceColIdx) {
    const ws = {};
    const range = {s:{c:0,r:0},e:{c:headers.length-1,r:rows.length}};
    headers.forEach((h,c)=>{
      const ref = XLSXStyle.utils.encode_cell({r:0,c});
      ws[ref]={v:h,s:hdrStyle};
    });
    rows.forEach((row,ri)=>{
      const conf = confidenceColIdx!=null ? row[confidenceColIdx] : null;
      const fillRgb = CONF_FILL[conf]||null;
      row.forEach((val,c)=>{
        const ref = XLSXStyle.utils.encode_cell({r:ri+1,c});
        const s = fillRgb ? {fill:{fgColor:{rgb:fillRgb}},font:{name:"Arial"},alignment:{wrapText:true}} : {font:{name:"Arial"},alignment:{wrapText:true}};
        ws[ref]={v:String(val||""),s};
      });
    });
    ws["!ref"]=XLSXStyle.utils.encode_range(range);
    ws["!cols"]=headers.map((_,i)=>({wch: i===(confidenceColIdx??-1) ? 12 : 40}));
    return ws;
  }

  // Summary
  const sumWs = {};
  sumWs["A1"]={v:`Model BOM — ${bom.modelId}`,s:titleStyle};
  sumWs["A3"]={v:"Model License",s:{font:{bold:true}}};
  sumWs["B3"]={v:bom.modelLicense};
  sumWs["A4"]={v:"Confidence legend",s:{font:{bold:true}}};
  sumWs["B4"]={v:"GREEN=HIGH | YELLOW=MEDIUM | ORANGE=LOW | RED=UNRESOLVED",s:{font:{italic:true,sz:9}}};
  sumWs["!ref"]="A1:B6";
  sumWs["!cols"]=[{wch:36},{wch:60}];
  XLSXStyle.utils.book_append_sheet(wb, sumWs, "Summary");

  // Dataset Licenses
  const dsRows = Object.entries(bom.datasetLicenses).map(([id,i])=>
    [id, i.license||"", i.confidence||"UNRESOLVED", i.via||"", i.source||"", firstUrl(i.source||"")]);
  XLSXStyle.utils.book_append_sheet(wb, makeSheet(["Dataset","License","Confidence","Resolved Via","Source / Notes","Link"], dsRows, 2), "Dataset Licenses");

  // arXiv-derived datasets (separate sheet — clearly labelled as unverified)
  const arxivRows = Object.entries(bom.arxivDatasets||{}).map(([name,i])=>
    [name, i.license||"", i.confidence||"UNRESOLVED", i.via||"", i.source||"", firstUrl(i.source||"")]);
  if (arxivRows.length) {
    XLSXStyle.utils.book_append_sheet(wb,
      makeSheet(["Dataset (text-mined name)","License","Confidence","Resolved Via","Source / Notes","Link"], arxivRows, 2),
      "arXiv Paper Datasets");
  }

  // Dependencies
  const depRows = bom.dependencies.map(d=>
    [d.library, d.version, d.license, d.confidence||"UNRESOLVED", d.source||"", d.depSource||"", firstUrl(d.source||"")]);
  XLSXStyle.utils.book_append_sheet(wb, makeSheet(["Library","Version","License","Confidence","License Source","Dependency Source","Link"], depRows, 3), "Dependencies");

  const fname = bom.modelId.replace(/\//g,"_") + "_bom.xlsx";
  XLSXStyle.writeFile(wb, fname);
}

// ── Main handler ───────────────────────────────────────────────────
async function handleRun() {
  const urlIn = document.getElementById("urlIn").value.trim();
  if (!urlIn) { alert("Please enter a HuggingFace model URL or ID."); return; }
  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  btn.textContent = "Running…";
  logLines = [];
  document.getElementById("log").style.display = "none";
  document.getElementById("results").style.display = "none";
  currentBom = null;

  try {
    currentBom = await buildBOM(urlIn);
    renderResults(currentBom);
    log("✓ Done.");
  } catch(e) {
    log(`✗ Error: ${e.message}`);
    alert(`Failed: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Run BOM →";
  }
}

document.getElementById("dlBtn").onclick = async () => {
  if (!currentBom) { alert("Run a BOM first."); return; }
  const btn = document.getElementById("dlBtn");
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Building\u2026";
  try {
    const resp = await fetch("/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(currentBom)
    });
    if (!resp.ok) throw new Error("server returned " + resp.status);
    const blob = await resp.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (currentBom.modelId || "model").replace(/\//g, "_") + "_bom.xlsx";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) {
    alert("Could not build the Excel file: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
};

// Allow Enter key to trigger run
document.getElementById("urlIn").addEventListener("keydown", e => {
  if (e.key === "Enter") handleRun();
});
</script>

  b.innerHTML = "\u26A0 This page was opened directly as a file, so it cannot reach the network. Close it and double-click <b>Launch BOM.bat</b> instead \u2014 that starts the local server this tool needs.";

}
